<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141b26" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2fd9d0" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#6fc6f0" stop-opacity=".8"/>
      <stop offset="75%" stop-color="#2fd9d0" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#141b26" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-600 0; 600 0; -600 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="6" fill="url(#wave-grad)"/>
</svg>
