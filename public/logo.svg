<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c2735"/>
      <stop offset="100%" stop-color="#141b26"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="grad-a" offset="0%" stop-color="#2fd9d0"/>
      <stop class="grad-b" offset="100%" stop-color="#6fc6f0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fc6f0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6fc6f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
      @keyframes drift { 0%,100% { stop-color: #2fd9d0; } 50% { stop-color: #6fc6f0; } }
      .ring { transform-origin: 60px 60px; animation: spin 6s linear infinite; }
      .mark { transform-origin: 60px 60px; animation: breathe 4.2s ease-in-out infinite; }
      .grad-a, .grad-b { animation: drift 5s ease-in-out infinite; }
      .grad-b { animation-delay: 2.5s; }
    </style>
  <circle cx="60" cy="60" r="54" fill="url(#glowGrad)" opacity=".5"/>
  <circle cx="60" cy="60" r="50" fill="url(#bgGrad)" stroke="#ffffff14" stroke-width="1"/>
  
    <g class="ring">
      <circle cx="60" cy="60" r="54" fill="none" stroke="url(#ringGrad)"
        stroke-width="2.4" stroke-linecap="round" stroke-dasharray="70 270" />
    </g>
  <g class="mark" transform="translate(60,60) scale(0.72) translate(-62,-64)">
    <path d="M33 39 A19 19 0 1 0 33.01 39 Z M33 47 A11 11 0 1 0 33.01 47 Z" fill="#f7f8fa" fill-rule="evenodd"/>
    <path d="M78 14 L54 90 L68 90 Z" fill="#6fc6f0"/>
    <path d="M78 14 L102 90 L88 90 Z" fill="#6fc6f0"/>
    <path d="M70.3 59 L85.7 59 L84 67 L72 67 Z" fill="#6fc6f0"/>
  </g>
</svg>